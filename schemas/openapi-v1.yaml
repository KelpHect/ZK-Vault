openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: RusticStack Core (ZK-Vault) Blind Zero-Knowledge API
  version: 1.0.0
  summary: Normative OpenAPI 3.1 specification for RusticStack Core /api/v1 blind relay, cryptographic RBAC graph, VSS recovery, C2SP audit log, and opaque real-time sync endpoints.
  description: |
    Authoritative REST, C2SP `tlog-tiles`, and real-time sync wire specification for **RusticStack Core (`ZK-Vault`)**.

    ### Transport & Serialization Invariants
    - **TLS 1.3 Mandatory** with hybrid post-quantum key exchange group `X25519MLKEM768` preferred.
    - **Cryptographic Envelopes** (`AuditEnvelope`, `EncryptedItemEnvelope`, `WrappedKeyEdge`, `VssEscrowBundle`, `DeviceAttestationPayload`, `TenantManifestPayload`) MUST be serialized as **RFC 8949 Section 4.2 Deterministic CBOR** and transmitted in JSON/HTTP headers as unpadded **Base64URL (RFC 4648 Section 5)**.
    - **Canonical Request Signing** (`X-RSV-Request-Signature`) signs method, normalized path, sorted query, `X-RSV-Tenant-Id`, `X-RSV-Device-Id`, millisecond timestamp, 16-byte nonce, `SHA-256(body)`, and `SHA-256(decoded_audit_envelope)` using `HDIK` or `UIK`.
  license:
    name: Dual MIT / Apache-2.0
    url: https://github.com/KelpHect/ZK-Vault
  contact:
    name: RusticStack Core Protocol Maintainers
    url: https://github.com/KelpHect/ZK-Vault

servers:
  - url: https://api.rusticstack.example
    description: Production Zero-Knowledge API Gateway (TLS 1.3 + X25519MLKEM768)
  - url: https://{tenant_host}
    description: Dedicated Enterprise / Self-Hosted Instance (Optional mTLS)
    variables:
      tenant_host:
        default: vault.corp.example

tags:
  - name: Health
    description: Service readiness, supported cipher suites, and clock synchronization.
  - name: Auth
    description: WebAuthn + PRF registration/login ceremonies and rotating session tokens.
  - name: Tenant & Directory
    description: Signed tenant manifest, verifiable public key directory, and hardware device attestation.
  - name: Key Graph
    description: Hierarchical cryptographic RBAC DAG (Org -> Team -> Collection -> User) and epoch rotations.
  - name: Vault Items
    description: Optimistically versioned encrypted vault items and immutable ciphertext revisions.
  - name: Recovery & Escrow
    description: Verifiable Secret Sharing (M-of-N VSS) escrow bundles and quorum recovery ceremonies.
  - name: Audit Log
    description: Per-tenant C2SP tlog-tiles Merkle transparency log checkpoints, tiles, and signed leaf entries.
  - name: Sync Stream
    description: Real-time opaque synchronization stream over WebSocket (rsv-sync.v1) or SSE fallback.

security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service liveness, readiness, supported cipher suites, and server UTC time
      security: []
      responses:
        '200':
          description: Service is healthy and ready to serve TLS 1.3 requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/webauthn/register/start:
    post:
      operationId: startWebAuthnRegister
      tags: [Auth]
      summary: Initiate WebAuthn credential registration ceremony with PRF salt generation
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegisterStartRequest'
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialCreationOptions and deterministic PRF salt issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegisterStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/webauthn/register/finish:
    post:
      operationId: finishWebAuthnRegister
      tags: [Auth]
      summary: Complete WebAuthn registration and store encrypted UMK/UIK/UEK identity bundles
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegisterFinishRequest'
      responses:
        '201':
          description: User identity and initial encrypted key bundles created and committed to audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnRegisterFinishResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/webauthn/login/start:
    post:
      operationId: startWebAuthnLogin
      tags: [Auth]
      summary: Initiate WebAuthn authentication ceremony returning PRF evaluation salt
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginStartRequest'
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialRequestOptions and PRF salt issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnLoginStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/webauthn/login/finish:
    post:
      operationId: finishWebAuthnLogin
      tags: [Auth]
      summary: Verify WebAuthn assertion and issue session tokens plus encrypted UMK/UIK/UEK bundles
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginFinishRequest'
      responses:
        '200':
          description: Authentication succeeded; short-lived access token, rotating refresh token, and encrypted key bundles returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnLoginFinishResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/session/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Rotate single-use refresh token and mint fresh access token (reuse triggers full family revocation)
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
      responses:
        '200':
          description: Session tokens rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/session/revoke:
    post:
      operationId: revokeSession
      tags: [Auth]
      summary: Immediately revoke current, specified, or all user sessions and broadcast session_revoked sync event
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRevokeRequest'
      responses:
        '200':
          description: Session(s) revoked and committed to audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/tenant/manifest:
    get:
      operationId: getTenantManifest
      tags: [Tenant & Directory]
      summary: Retrieve signed tenant security manifest, allowed cipher suites, escrow policy, and C2SP log keys
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
      responses:
        '200':
          description: Signed tenant manifest returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantManifestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/users/directory:
    get:
      operationId: listUsersDirectory
      tags: [Tenant & Directory]
      summary: List verified tenant user public keys (UIK/UEK) with transparency log inclusion references
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: updated_after
          in: query
          required: false
          description: Filter users updated strictly after this RFC 3339 UTC timestamp.
          schema:
            $ref: '#/components/schemas/IsoTimestamp'
      responses:
        '200':
          description: Paginated tenant user public key directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDirectoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/users/devices:
    post:
      operationId: registerUserDevice
      tags: [Tenant & Directory]
      summary: Register and attest a new hardware device identity key (HDIK) countersigned by UIK
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        '201':
          description: Device registered and hardware attestation verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/graph/my-edges:
    get:
      operationId: getMyGraphEdges
      tags: [Key Graph]
      summary: Retrieve all encrypted RBAC graph edges reachable by the authenticated user
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - name: since_revision
          in: query
          required: false
          description: Optional monotonic graph revision number for delta retrieval.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Encrypted graph nodes and wrapped key edges reachable by caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/graph/org:
    get:
      operationId: getOrgGraph
      tags: [Key Graph]
      summary: Retrieve complete tenant encrypted key-graph topology for Org Admin local decryption
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - name: since_revision
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Full tenant encrypted DAG snapshot for authorized Org Admins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/teams:
    post:
      operationId: createTeam
      tags: [Key Graph]
      summary: Create a team node at active_key_epoch=1 with initial signed KEM-wrapped TEK edges
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Team created and initial edges committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/teams/{team_id}/rotate:
    patch:
      operationId: rotateTeamKeyEpoch
      tags: [Key Graph]
      summary: Atomically rotate Team Encryption Key (TEK) to expected_key_epoch + 1 with replacement edges
      parameters:
        - name: team_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpochRotateRequest'
      responses:
        '200':
          description: Team key epoch rotated atomically and epoch_rotated sync event emitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochRotateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/collections:
    post:
      operationId: createCollection
      tags: [Key Graph]
      summary: Create a collection node at active_key_epoch=1 with initial signed KEM-wrapped CEK edges
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreateRequest'
      responses:
        '201':
          description: Collection created and initial edges committed atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/collections/{collection_id}/rotate:
    patch:
      operationId: rotateCollectionKeyEpoch
      tags: [Key Graph]
      summary: Atomically rotate Collection Encryption Key (CEK) to expected_key_epoch + 1
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpochRotateRequest'
      responses:
        '200':
          description: Collection key epoch rotated atomically and epoch_rotated sync event emitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpochRotateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/graph/edges:
    post:
      operationId: createGraphEdge
      tags: [Key Graph]
      summary: Insert a signed KEM-wrapped cryptographic RBAC graph edge (enforces DAG acyclicity and active key_epoch)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedWrappedEdgeInput'
      responses:
        '201':
          description: Cryptographic edge inserted and committed to audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/graph/edges/{edge_id}:
    delete:
      operationId: deleteGraphEdge
      tags: [Key Graph]
      summary: Remove a cryptographic RBAC graph edge (epoch rotation recommended for forward secrecy)
      parameters:
        - name: edge_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Graph edge removed and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/collections/{collection_id}/items:
    get:
      operationId: listCollectionItems
      tags: [Vault Items]
      summary: List encrypted vault items in a collection with cursor pagination
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: updated_after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IsoTimestamp'
      responses:
        '200':
          description: Paginated list of encrypted item envelopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionItemsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

    post:
      operationId: createCollectionItem
      tags: [Vault Items]
      summary: Create an encrypted vault item bound to the collection's current active_key_epoch
      parameters:
        - name: collection_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
      responses:
        '201':
          description: Encrypted item created at version 1.
          headers:
            ETag:
              description: Version ETag for optimistic concurrency (e.g., "v1").
              schema:
                type: string
            X-RSV-Audit-Leaf-Index:
              description: Monotonic C2SP audit log leaf index committing this mutation.
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/items/{item_id}:
    get:
      operationId: getItem
      tags: [Vault Items]
      summary: Retrieve latest encrypted vault item envelope (audited read)
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
      responses:
        '200':
          description: Latest encrypted item envelope returned and read access committed to audit log.
          headers:
            ETag:
              schema:
                type: string
            X-RSV-Audit-Leaf-Index:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedItemRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

    put:
      operationId: updateItem
      tags: [Vault Items]
      summary: Optimistically update encrypted vault item enforcing both If-Match version and collection active_key_epoch
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
      responses:
        '200':
          description: Item updated atomically; prior version archived in immutable revisions table.
          headers:
            ETag:
              schema:
                type: string
            X-RSV-Audit-Leaf-Index:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      operationId: deleteItem
      tags: [Vault Items]
      summary: Soft-delete or purge an encrypted vault item with optimistic version verification
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [soft, purge]
            default: soft
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchHeaderRequired'
      responses:
        '200':
          description: Item deleted and audited.
          headers:
            X-RSV-Audit-Leaf-Index:
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/items/{item_id}/revisions:
    get:
      operationId: listItemRevisions
      tags: [Vault Items]
      summary: Retrieve paginated immutable revision history of encrypted item envelopes
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Immutable historical ciphertext revisions returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRevisionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/recovery/ceremonies:
    post:
      operationId: executeRecoveryCeremonyAction
      tags: [Recovery & Escrow]
      summary: Initiate an M-of-N VSS recovery ceremony or submit a custodian's re-wrapped share contribution
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCeremonyActionRequest'
      responses:
        '200':
          description: Custodian share recorded and ceremony status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCeremonyResponse'
        '201':
          description: New M-of-N recovery ceremony initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCeremonyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/recovery/ceremonies/{ceremony_id}:
    get:
      operationId: getRecoveryCeremony
      tags: [Recovery & Escrow]
      summary: Inspect recovery ceremony state or release threshold shares once quorum M-of-N is met
      parameters:
        - name: ceremony_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: release_shares
          in: query
          required: false
          description: When true, returns re-wrapped shares ONLY if collected_shares >= threshold_m (else 412 QUORUM_THRESHOLD_UNMET).
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
      responses:
        '200':
          description: Recovery ceremony details (and re-wrapped shares if release_shares=true and quorum met).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCeremonyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/QuorumThresholdUnmet'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/recovery/escrow-bundle:
    post:
      operationId: uploadEscrowBundle
      tags: [Recovery & Escrow]
      summary: Upload verifiable M-of-N VSS escrow bundle validated against tenant escrow policy
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
        - $ref: '#/components/parameters/AuditEnvelopeHeaderRequired'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowBundleUploadRequest'
      responses:
        '201':
          description: VSS escrow bundle validated and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowBundleUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/audit/checkpoint:
    get:
      operationId: getAuditCheckpoint
      tags: [Audit Log]
      summary: Fetch latest C2SP signed-note transparency log checkpoint (Ed25519 + ML-DSA-65 cosigned)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
      responses:
        '200':
          description: C2SP signed-note checkpoint payload.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/plain:
              schema:
                type: string
                description: Canonical C2SP signed-note text containing origin, tree_size, base64 root hash, and Ed25519 + ML-DSA-65 signature lines.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/audit/tile/{level}/{index}:
    get:
      operationId: getAuditFullTile
      tags: [Audit Log]
      summary: Fetch complete immutable C2SP tlog-tiles Merkle tile (256 x 32-byte SHA-256 hashes = 8192 bytes)
      parameters:
        - name: level
          in: path
          required: true
          description: Tile height level (0..63; each tile has height 8 -> 256 nodes).
          schema:
            type: integer
            minimum: 0
            maximum: 63
        - name: index
          in: path
          required: true
          description: Tile index at the specified level (non-negative decimal or C2SP 3-digit grouped index).
          schema:
            type: string
            pattern: '^(x[0-9]{3}/)*[0-9]+$'
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
      responses:
        '200':
          description: Exactly 8192 raw bytes representing 256 concatenated 32-byte SHA-256 hashes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=31536000, immutable
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/audit/tile/{level}/{index}.p/{width}:
    get:
      operationId: getAuditPartialTile
      tags: [Audit Log]
      summary: Fetch rightmost partial C2SP tlog-tiles Merkle tile (width x 32-byte SHA-256 hashes, 1 <= width <= 255)
      parameters:
        - name: level
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 63
        - name: index
          in: path
          required: true
          schema:
            type: string
            pattern: '^(x[0-9]{3}/)*[0-9]+$'
        - name: width
          in: path
          required: true
          description: Number of populated 32-byte hash entries in this partial tile.
          schema:
            type: integer
            minimum: 1
            maximum: 255
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
      responses:
        '200':
          description: Exactly width * 32 raw bytes of SHA-256 node hashes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/audit/entries/{index}:
    get:
      operationId: getAuditEntry
      tags: [Audit Log]
      summary: Fetch immutable signed deterministic CBOR audit log entry at leaf index
      parameters:
        - name: index
          in: path
          required: true
          description: Zero-based leaf index in the tenant's C2SP transparency log.
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/RequestSignatureHeader'
      responses:
        '200':
          description: Immutable deterministic CBOR audit entry and verified leaf hash.
          headers:
            Cache-Control:
              schema:
                type: string
                const: public, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/sync/stream:
    get:
      operationId: connectSyncStream
      tags: [Sync Stream]
      summary: Real-time opaque vault synchronization stream (WebSocket rsv-sync.v1 primary, SSE fallback)
      description: |
        Upgrades to WebSocket subprotocol `rsv-sync.v1` when `Upgrade: websocket` is supplied, or opens a Server-Sent Events (`text/event-stream`) stream when `Accept: text/event-stream` is supplied.
        Native clients authenticate via standard HTTP headers (`Authorization`, `X-RSV-Tenant-Id`, `X-RSV-Device-Id`, `X-RSV-Request-Signature`); browser WebSocket clients MUST send a `SyncClientAuthFrame` as their first frame within 5 seconds of connect (never passing tokens in URL query parameters).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque resume cursor returned in prior sync events (used for SSE or header-authenticated WebSocket upgrade).
          schema:
            $ref: '#/components/schemas/Base64Url'
        - name: X-RSV-Tenant-Id
          in: header
          required: false
          description: Required on SSE and native WebSocket upgrades (supplied in first WebSocket authenticate frame for browsers).
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: X-RSV-Device-Id
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/UuidV7'
        - name: X-RSV-Request-Signature
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/RequestSignatureValue'
      responses:
        '101':
          description: Switching Protocols to WebSocket subprotocol `rsv-sync.v1`.
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: string
                const: rsv-sync.v1
        '200':
          description: Server-Sent Events (`text/event-stream`) opaque synchronization stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SyncServerFrame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived signed session token bound to `(tenant_id, user_id, device_id, session_id)` paired with `X-RSV-Request-Signature`.
    MutualTLS:
      type: mutualTLS
      description: Optional enterprise device client certificate authentication enforced when `tenant/manifest.mtls_required` is true.

  parameters:
    TenantIdHeader:
      name: X-RSV-Tenant-Id
      in: header
      required: true
      description: Canonical lowercase UUIDv7 tenant identifier enforced against JWT `tid` claim and PostgreSQL RLS.
      schema:
        $ref: '#/components/schemas/UuidV7'
    DeviceIdHeader:
      name: X-RSV-Device-Id
      in: header
      required: true
      description: Canonical lowercase UUIDv7 registered device identifier bound to `HDIK`.
      schema:
        $ref: '#/components/schemas/UuidV7'
    RequestSignatureHeader:
      name: X-RSV-Request-Signature
      in: header
      required: true
      description: Canonical hybrid request signature covering method, normalized path, sorted query, tenant_id, device_id, ts, nonce, SHA-256(body), and SHA-256(decoded audit envelope).
      schema:
        $ref: '#/components/schemas/RequestSignatureValue'
    AuditEnvelopeHeaderRequired:
      name: X-RSV-Audit-Envelope
      in: header
      required: true
      description: Unpadded Base64URL-encoded RFC 8949 deterministic CBOR signed client AuditEnvelope.
      schema:
        $ref: '#/components/schemas/Base64Url'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUIDv7/UUIDv4 deduplication token scoped for 24 hours.
      schema:
        type: string
        format: uuid
    IfMatchHeaderRequired:
      name: If-Match
      in: header
      required: true
      description: Quoted version ETag matching expected item version (e.g. `"v4"`).
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor token returned by a previous page.
      schema:
        $ref: '#/components/schemas/Base64Url'
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Malformed request, missing mandatory `X-RSV-Audit-Envelope`, or unsupported cipher suite.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid or expired bearer token, failed `X-RSV-Request-Signature` verification, replay detected, or revoked device.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TenantMismatch:
      description: Tenant isolation violation (`TENANT_MISMATCH`) or insufficient authorization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Target resource does not exist within caller's authorized tenant scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Optimistic concurrency mismatch (`VERSION_CONFLICT`) or stale key epoch (`STALE_KEY_EPOCH`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuorumThresholdUnmet:
      description: Recovery ceremony has fewer custodian shares than `threshold_m` (`QUORUM_THRESHOLD_UNMET`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Cryptographic or policy invariant failed (`GRAPH_CYCLE_REJECTED`, `ESCROW_POLICY_VIOLATION`, `DEVICE_ATTESTATION_FAILED`, `AUDIT_COMMITMENT_INVALID`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Sliding-window rate limit exceeded (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UuidV7:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples:
        - 01934567-89ab-7cde-8f01-23456789abcd

    Base64Url:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: Unpadded RFC 4648 Section 5 Base64URL string.

    IsoTimestamp:
      type: string
      format: date-time
      examples:
        - '2026-11-19T19:30:00.000Z'

    CipherSuite:
      type: string
      enum:
        - RSV-HYBRID-2026-V1
        - RSV-HYBRID-FIPS-2026-V1

    RequestSignatureValue:
      type: string
      pattern: '^v=1; kid=[0-9a-f-]{36}; signer=(hdik|uik); suite=(RSV-HYBRID-2026-V1|RSV-HYBRID-FIPS-2026-V1); ts=[0-9]{13,16}; nonce=[A-Za-z0-9_-]{22}; sig=[A-Za-z0-9_-]+$'

    ErrorCode:
      type: string
      enum:
        - TENANT_MISMATCH
        - INVALID_SIGNATURE
        - MISSING_AUDIT_ENVELOPE
        - STALE_KEY_EPOCH
        - VERSION_CONFLICT
        - GRAPH_CYCLE_REJECTED
        - ESCROW_POLICY_VIOLATION
        - UNSUPPORTED_CIPHER_SUITE
        - DEVICE_ATTESTATION_FAILED
        - RATE_LIMITED
        - QUORUM_THRESHOLD_UNMET
        - AUDIT_COMMITMENT_INVALID

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            request_id:
              $ref: '#/components/schemas/UuidV7'
            retryable:
              type: boolean
            retry_after_ms:
              type: ['integer', 'null']
              minimum: 0
            details:
              type: ['object', 'null']
              additionalProperties: true

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, api_version, supported_cipher_suites, tls_pq_enabled, server_time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        api_version:
          type: string
          const: v1
        supported_cipher_suites:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CipherSuite'
        tls_pq_enabled:
          type: boolean
        server_time:
          $ref: '#/components/schemas/IsoTimestamp'

    KdfMetadata:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [webauthn_prf_v1, argon2id_v1]
        prf_salt_nonce:
          type: ['string', 'null']
          pattern: '^[A-Za-z0-9_-]+$'
        argon2_memory_kib:
          type: ['integer', 'null']
          minimum: 65536
        argon2_iterations:
          type: ['integer', 'null']
          minimum: 3
        argon2_parallelism:
          type: ['integer', 'null']
          minimum: 1

    WebAuthnRegisterStartRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, email, display_name]
      properties:
        tenant_id:
          $ref: '#/components/schemas/UuidV7'
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        enrollment_token:
          type: ['string', 'null']

    WebAuthnRegisterStartResponse:
      type: object
      additionalProperties: false
      required: [ceremony_id, public_key_credential_creation_options, prf_salt_v1]
      properties:
        ceremony_id:
          $ref: '#/components/schemas/UuidV7'
        public_key_credential_creation_options:
          type: object
          additionalProperties: true
        prf_salt_v1:
          $ref: '#/components/schemas/Base64Url'

    WebAuthnRegisterFinishRequest:
      type: object
      additionalProperties: false
      required:
        - ceremony_id
        - attestation_response
