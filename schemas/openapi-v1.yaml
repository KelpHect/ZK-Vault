        ephemeral_recovery_uek_public_key:
          $ref: '#/components/schemas/Base64Url'
        cipher_suite:
          $ref: '#/components/schemas/CipherSuite'
        reason_code:
          type: string
          enum: [device_loss, passkey_loss, enterprise_audit_recovery]

    RecoveryCeremonySubmitShareRequest:
      type: object
      additionalProperties: false
      required: [action, ceremony_id, share_index, rewrapped_share_cbor, custodian_signature]
      properties:
        action:
          type: string
          const: submit_share
        ceremony_id:
          $ref: '#/components/schemas/UuidV7'
        share_index:
          type: integer
          minimum: 1
          maximum: 64
        rewrapped_share_cbor:
          $ref: '#/components/schemas/Base64Url'
        custodian_signature:
          $ref: '#/components/schemas/Base64Url'

    RecoveryCeremonyActionRequest:
      oneOf:
        - $ref: '#/components/schemas/RecoveryCeremonyInitiateRequest'
        - $ref: '#/components/schemas/RecoveryCeremonySubmitShareRequest'
      discriminator:
        propertyName: action
        mapping:
          initiate: '#/components/schemas/RecoveryCeremonyInitiateRequest'
          submit_share: '#/components/schemas/RecoveryCeremonySubmitShareRequest'

    ReleasedRecoveryShare:
      type: object
      additionalProperties: false
      required: [share_index, custodian_user_id, rewrapped_share_cbor, custodian_signature, submitted_at]
      properties:
        share_index:
          type: integer
          minimum: 1
          maximum: 64
        custodian_user_id:
          $ref: '#/components/schemas/UuidV7'
        rewrapped_share_cbor:
          $ref: '#/components/schemas/Base64Url'
        custodian_signature:
          $ref: '#/components/schemas/Base64Url'
        submitted_at:
          $ref: '#/components/schemas/IsoTimestamp'

    RecoveryCeremonyResponse:
      type: object
      additionalProperties: false
      required:
        - ceremony_id
        - escrow_id
        - status
        - threshold_m
        - total_shares_n
        - collected_shares
        - vss_commitments_cbor
        - ephemeral_recovery_uek_public_key
        - created_at
        - expires_at
        - audit_leaf_index
      properties:
        ceremony_id:
          $ref: '#/components/schemas/UuidV7'
        escrow_id:
          $ref: '#/components/schemas/UuidV7'
        status:
          type: string
          enum: [pending_quorum, quorum_met, completed, expired, cancelled]
        threshold_m:
          type: integer
          minimum: 1
        total_shares_n:
          type: integer
          minimum: 1
        collected_shares:
          type: integer
          minimum: 0
        vss_commitments_cbor:
          $ref: '#/components/schemas/Base64Url'
        ephemeral_recovery_uek_public_key:
          $ref: '#/components/schemas/Base64Url'
        released_shares:
          type: ['array', 'null']
          items:
            $ref: '#/components/schemas/ReleasedRecoveryShare'
        created_at:
          $ref: '#/components/schemas/IsoTimestamp'
        expires_at:
          $ref: '#/components/schemas/IsoTimestamp'
        audit_leaf_index:
          type: integer
          format: int64
          minimum: 0

    AuditEntryResponse:
      type: object
      additionalProperties: false
      required: [leaf_index, leaf_hash, recorded_at, audit_envelope_cbor]
      properties:
        leaf_index:
          type: integer
          format: int64
          minimum: 0
        leaf_hash:
          $ref: '#/components/schemas/Base64Url'
        recorded_at:
          $ref: '#/components/schemas/IsoTimestamp'
        audit_envelope_cbor:
          $ref: '#/components/schemas/Base64Url'

    SyncEventType:
      type: string
      enum:
        - item_upserted
        - item_deleted
        - edge_granted
        - edge_revoked
        - epoch_rotated
        - recovery_ceremony_updated
        - audit_checkpoint_advanced
        - session_revoked

    SyncClientFrame:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, tenant_id, device_id, access_token, request_signature]
          properties:
            type:
              type: string
              const: authenticate
            tenant_id:
              $ref: '#/components/schemas/UuidV7'
            device_id:
              $ref: '#/components/schemas/UuidV7'
            access_token:
              type: string
            request_signature:
              $ref: '#/components/schemas/RequestSignatureValue'
            resume_cursor:
              oneOf:
                - $ref: '#/components/schemas/Base64Url'
                - type: 'null'
        - type: object
          additionalProperties: false
          required: [type, cursor]
          properties:
            type:
              type: string
              const: ack
            cursor:
              $ref: '#/components/schemas/Base64Url'
        - type: object
          additionalProperties: false
          required: [type, ts]
          properties:
            type:
              type: string
              const: ping
            ts:
              type: integer
              format: int64

    SyncServerFrame:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, session_id, current_cursor, heartbeat_interval_ms]
          properties:
            type:
              type: string
              const: authenticated
            session_id:
              $ref: '#/components/schemas/UuidV7'
            current_cursor:
              $ref: '#/components/schemas/Base64Url'
            heartbeat_interval_ms:
              type: integer
              minimum: 5000
              maximum: 60000
        - type: object
          additionalProperties: false
          required: [type, cursor, event_id, event_type, occurred_at, payload]
          properties:
            type:
              type: string
              const: event
            cursor:
              $ref: '#/components/schemas/Base64Url'
            event_id:
              $ref: '#/components/schemas/UuidV7'
            event_type:
              $ref: '#/components/schemas/SyncEventType'
            occurred_at:
              $ref: '#/components/schemas/IsoTimestamp'
            payload:
              type: object
              additionalProperties: true
        - type: object
          additionalProperties: false
          required: [type, ts]
          properties:
            type:
              type: string
              const: pong
            ts:
              type: integer
              format: int64
        - type: object
          additionalProperties: false
          required: [type, reason, min_available_cursor]
          properties:
            type:
              type: string
              const: resync_required
            reason:
              type: string
              enum: [cursor_expired, backpressure_overflow, graph_epoch_reset]
            min_available_cursor:
              $ref: '#/components/schemas/Base64Url'
